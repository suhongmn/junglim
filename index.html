<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min Suhong | Computational Architect Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #e2e1dd; color: #121212; }
        .premium-border { border: 1px solid rgba(18, 18, 18, 0.12); }
        .image-drop-zone { border: 2px dashed rgba(18, 18, 18, 0.2); transition: 0.3s; }
        .image-drop-zone:hover { background: rgba(0,0,0,0.05); }
    </style>
</head>
<body class="antialiased selection:bg-inkDark selection:text-[#e2e1dd]">

    <!-- 헤더와 Hero 섹션은 기존 유지 -->
    <header class="fixed top-0 left-0 w-full z-50 px-12 py-6 flex justify-between items-start pointer-events-none">
        <a href="#" class="pointer-events-auto text-2xl tracking-[0.25em] font-extrabold text-inkDark">M<span class="font-light text-gray-500">S</span>H</a>
        <div class="pointer-events-auto text-right text-xs font-mono text-gray-600">tofromnok@gmail.com</div>
    </header>

    <section id="portfolio" class="py-24 bg-[#eae9e6] mt-20">
        <div class="max-w-7xl mx-auto px-6">
            <h2 class="text-6xl font-light mb-16">Featured Projects</h2>

            <!-- 이미지 관리 기능이 통합된 프로젝트 카드 -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="portfolio-grid">
                
                <!-- 프로젝트 카드 템플릿 -->
                <div class="glass-panel bg-white p-6 rounded-lg shadow-sm border border-gray-200" data-project-id="twist-tower">
                    <h3 class="text-xl font-bold mb-4">The Twist Residential Tower</h3>
                    
                    <!-- 이미지 드롭존 -->
                    <div class="image-drop-zone p-4 mb-4 rounded flex flex-col items-center justify-center text-center text-xs text-gray-400 cursor-pointer" 
                         onclick="document.getElementById('file-twist-tower').click()">
                        <i class="fa-solid fa-cloud-arrow-up text-xl mb-2"></i>
                        <span>이미지 드래그/클릭 추가</span>
                        <input type="file" id="file-twist-tower" class="hidden" multiple accept="image/*" onchange="handleFiles(this, 'twist-tower')">
                    </div>

                    <!-- 이미지 그리드 -->
                    <div id="grid-twist-tower" class="grid grid-cols-3 gap-2 mt-2">
                        <!-- 이미지들이 여기에 추가됨 -->
                    </div>
                </div>

                <!-- 다른 프로젝트들도 동일한 구조로 추가 가능 -->
            </div>
        </div>
    </section>

    <script>
        // 이미지 추가 처리 함수
        function handleFiles(input, projectId) {
            const files = input.files;
            const grid = document.getElementById(`grid-${projectId}`);
            
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const imgContainer = document.createElement('div');
                    imgContainer.className = 'relative group';
                    imgContainer.innerHTML = `
                        <img src="${e.target.result}" class="w-full h-16 object-cover rounded">
                        <button onclick="this.parentElement.remove()" class="absolute -top-1 -right-1 bg-red-500 text-white text-[8px] px-1 rounded-full opacity-0 group-hover:opacity-100">×</button>
                    `;
                    grid.appendChild(imgContainer);
                    saveToStorage(projectId);
                };
                reader.readAsDataURL(file);
            });
        }

        function saveToStorage(projectId) {
            const images = Array.from(document.getElementById(`grid-${projectId}`).querySelectorAll('img'))
                                .map(img => img.src);
            localStorage.setItem(`portfolio_images_${projectId}`, JSON.stringify(images));
        }

        // 페이지 로드 시 기존 이미지 불러오기
        window.onload = () => {
            document.querySelectorAll('[data-project-id]').forEach(el => {
                const pid = el.getAttribute('data-project-id');
                const saved = localStorage.getItem(`portfolio_images_${pid}`);
                if(saved) {
                    const images = JSON.parse(saved);
                    const grid = document.getElementById(`grid-${pid}`);
                    images.forEach(src => {
                        const imgContainer = document.createElement('div');
                        imgContainer.className = 'relative group';
                        imgContainer.innerHTML = `
                            <img src="${src}" class="w-full h-16 object-cover rounded">
                            <button onclick="this.parentElement.remove(); saveToStorage('${pid}')" class="absolute -top-1 -right-1 bg-red-500 text-white text-[8px] px-1 rounded-full opacity-0 group-hover:opacity-100">×</button>
                        `;
                        grid.appendChild(imgContainer);
                    });
                }
            });
        };
    </script>
</body>
</html>
